name: Business service candidate
on:
  # A new workflow cannot be dispatched until present on the default branch.
  # Limit branch-triggered builds to changes to these candidate build files.
  push:
    branches: [codex/life-write-intent-compiler]
    paths:
      - .github/workflows/business-candidate.yml
      - deploy/business-agent/Dockerfile.candidate
      - scripts/prepare-business-master-rollback.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'lilingnengus-cyber/buzz' && github.ref == 'refs/heads/codex/life-write-intent-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Build and export paired service and pause images
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          printf '%s\n' "$SOURCE_SHA" > candidate/source-sha.txt
          images=()
          for service in gateway business-core business-read-api iam-admin-api; do
            image="shiyue-business-candidate-${service}:${SOURCE_SHA}"
            docker build --file deploy/business-agent/Dockerfile.candidate --target "$service" --label "org.opencontainers.image.revision=$SOURCE_SHA" --tag "$image" .
            docker image inspect "$image" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .Config.Entrypoint}}' >> candidate/images.txt
            images+=("$image")
          done
          # Build rollback from exactly the same source, retaining schema and
          # authority fixes while pausing both newly introduced agent surfaces.
          mkdir "$RUNNER_TEMP/business-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/business-source"
          router_sha=$(sha256sum services/business-core/src/document_approval.rs | cut -d ' ' -f 1)
          python3 scripts/prepare-business-master-rollback.py \
            "$RUNNER_TEMP/business-source" "$RUNNER_TEMP/business-paused" \
            --expected-router-sha256 "$router_sha" --include-order-hold
          image="shiyue-business-candidate-writes-paused:${SOURCE_SHA}"
          docker build --file "$RUNNER_TEMP/business-paused/deploy/business-agent/Dockerfile.candidate" \
            --target business-core --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "com.shiyueshizi.business.mode=pause-master-and-order-hold-agent-routes" \
            --tag "$image" "$RUNNER_TEMP/business-paused"
          docker image inspect "$image" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .Config.Entrypoint}}' >> candidate/images.txt
          images+=("$image")
          cp "$RUNNER_TEMP/business-paused/master-rollback.json" candidate/
          docker save "${images[@]}" | gzip > candidate/business-images.tar.gz
          cd candidate
          sha256sum business-images.tar.gz images.txt source-sha.txt master-rollback.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-candidate-${{ github.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error
