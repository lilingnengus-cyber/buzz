name: Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.repository == 'lilingnengus-cyber/buzz' && github.ref == 'refs/heads/codex/huddle-archive-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lilingnengus-cyber/buzz:huddle-archive-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUZZ_SOURCE_SHA=${{ github.sha }}
            BUZZ_BUILD_ID=github-actions:${{ github.run_id }}
          cache-from: type=registry,ref=ghcr.io/lilingnengus-cyber/buzz-buildcache:amd64
          cache-to: type=registry,ref=ghcr.io/lilingnengus-cyber/buzz-buildcache:huddle-archive,mode=max
