name: Business hold candidate runtime
on:
  push:
    branches: [codex/life-write-intent-compiler]
    paths:
      - .github/workflows/business-hold-runtime.yml
      - scripts/verify-business-hold-runtime.py
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'lilingnengus-cyber/buzz' && github.ref == 'refs/heads/codex/life-write-intent-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Load exact successful candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35501065470 --repo lilingnengus-cyber/buzz --dir candidate
          cd candidate/business-candidate-99423340217f38e427997d8938ddfceb9d699ae0
          sha256sum --check SHA256SUMS
          test "$(cat source-sha.txt)" = 99423340217f38e427997d8938ddfceb9d699ae0
          python3 -c 'import json; p=json.load(open("master-rollback.json")); assert p["pausedModules"] == ["master", "order_hold", "adjustment", "report_snapshot", "operating_snapshot"]'
          gzip -dc business-images.tar.gz | docker load
      - name: Verify migration and pause routing on PostgreSQL 17
        run: python3 scripts/verify-business-hold-runtime.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: business-hold-runtime-evidence
          path: |
            runtime-evidence.json
            hold-*.log
          retention-days: 7
