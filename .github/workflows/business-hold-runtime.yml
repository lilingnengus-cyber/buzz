name: Business hold candidate runtime
on:
  push:
    branches: [codex/life-write-intent-compiler]
    paths:
      - .github/workflows/business-hold-runtime.yml
      - scripts/verify-business-hold-runtime.py
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'lilingnengus-cyber/buzz' && github.ref == 'refs/heads/codex/life-write-intent-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Load exact successful candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35482054779 --repo lilingnengus-cyber/buzz --dir candidate
          cd candidate/business-candidate-c186ddf01119acfb545c56dee7b77304874e282b
          sha256sum --check SHA256SUMS
          echo '22d56a501f15adf748949f79e2d09692225c44c5bbe6ddc84acf8433ce500651  business-images.tar.gz' | sha256sum --check
          test "$(cat source-sha.txt)" = c186ddf01119acfb545c56dee7b77304874e282b
          gzip -dc business-images.tar.gz | docker load
      - name: Verify migration and pause routing on PostgreSQL 17
        run: python3 scripts/verify-business-hold-runtime.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: business-hold-runtime-evidence
          path: |
            runtime-evidence.json
            hold-*.log
          retention-days: 7
