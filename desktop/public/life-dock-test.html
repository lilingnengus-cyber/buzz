<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeOS Dock Mock</title>
    <link rel="stylesheet" href="/business-dock-test.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Isolated Life Dock acceptance fixture</p>
      <h1>LifeOS Dock Mock</h1>
      <dl>
        <div><dt>Bridge</dt><dd id="bridge">connecting</dd></div>
        <div><dt>Theme</dt><dd id="theme">unknown</dd></div>
        <div><dt>Resource</dt><dd id="current-resource">dashboard</dd></div>
        <div><dt>Refreshes</dt><dd id="refresh-count">0</dd></div>
        <div><dt>Bootstrap</dt><dd id="bootstrap">direct</dd></div>
        <div><dt>Instance</dt><dd id="instance"></dd></div>
      </dl>
      <div class="actions">
        <button id="open-action" type="button">Open action fixture</button>
        <button id="mark-dirty" type="button">Mark Life Dirty</button>
        <button id="mark-clean" type="button">Mark Life Clean</button>
        <button id="expire-session" type="button">Expire Life Session</button>
      </div>
    </main>
    <script src="/life-dock-test.js"></script>
  </body>
</html>
